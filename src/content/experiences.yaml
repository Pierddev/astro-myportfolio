# Expériences professionnelles : timeline de la page À propos.
# L'ordre du fichier n'a pas d'importance : la timeline est triée par date de début, la plus récente en haut.
#
#   debut      mois de début, au format AAAA-MM (ex. 2025-09)
#   fin        mois de fin, au format AAAA-MM. Sans fin (ou fin à venir) : badge « En cours ».
#   poste, entreprise, lieu
#   logo       chemin du logo depuis ce fichier, ex. ../assets/logo-bretim.webp
#   logoAlt    texte alternatif du logo
#   missions   liste de { titre, description }
#   actif      false pour la masquer sans la supprimer (facultatif)

