# Stack technique : page Stack et sélection de l'accueil.
# Ordre du fichier = ordre d'affichage (catégories, puis technos dans chaque catégorie).
#
# Une catégorie : id (filtre de la page, sans espace), titre, titreCourt (bouton de filtre
# et accueil), couleur (#rrggbb), technos. Une catégorie sans techno active est masquée.
#
# Une techno :
#   nom, url (site officiel)
#   logo       chemin du logo depuis ce fichier, ex. ../assets/stacks/php.webp
#   inverser   true si le logo est sombre : il est inversé pour rester lisible (facultatif)
#   accueil    true pour l'afficher aussi sur la page d'accueil (facultatif)
#   actif      false pour la masquer partout sans la supprimer (facultatif)

